apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-webapp-to-mysql
  namespace: webapp-stack
spec:
  podSelector:
    matchLabels:
      app: mysql
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: webapp-api
        - podSelector:
            matchLabels:
              app: mysql
              role: read
      ports:
        - protocol: TCP
          port: 3306