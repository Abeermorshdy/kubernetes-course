apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-write
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.mysqlWrite.replicas }}
  selector:
    matchLabels:
      app: mysql
      role: write
  template:
    metadata:
      labels:
        app: mysql
        role: write
    spec:
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.storage.node }}
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_DATABASE
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_PASSWORD
          args:
            - --server-id=1
            - --log-bin=mysql-bin
            - --binlog-format=ROW

          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
            - name: mysql-init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: mysql-write-pvc
        - name: mysql-init
          configMap:
            name: mysql-init-script